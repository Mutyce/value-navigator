<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Семейная кулинарная книга">
  <title>Семейная кулинарная книга</title>

  <!-- Warm halo -->
  <circle cx="100" cy="120" r="80" fill="#F5EDE0" opacity="0.55"/>

  <!-- Soft shadow under book -->
  <ellipse cx="100" cy="180" rx="68" ry="5" fill="#3D2B1F" opacity="0.1"/>

  <!-- ===== Open book ===== -->
  <!-- Cover (back) -->
  <path d="M 28 132
           Q 100 124 172 132
           L 172 176
           Q 100 170 28 176 Z"
        fill="#E8784A"/>
  <!-- Cover bottom shade -->
  <path d="M 28 172 Q 100 167 172 172 L 172 176 Q 100 170 28 176 Z" fill="#000000" opacity="0.1"/>

  <!-- Left page -->
  <path d="M 33 130
           Q 66 126 100 124
           L 100 168
           Q 66 169 33 173 Z"
        fill="#FFFFFF"/>
  <!-- Right page -->
  <path d="M 100 124
           Q 134 126 167 130
           L 167 173
           Q 134 169 100 168 Z"
        fill="#FFFFFF"/>

  <!-- Spine shadow -->
  <path d="M 98 124 L 102 124 L 102 168 L 98 168 Z" fill="#000000" opacity="0.12"/>

  <!-- Heart on left page (recipe title) -->
  <path d="M 58 140
           C 58 136 54 134 51 137
           C 48 134 44 136 44 140
           C 44 146 51 153 51 153
           C 51 153 58 146 58 140 Z" fill="#F5A623"/>

  <!-- Recipe lines on left page -->
  <line x1="44" y1="159" x2="92" y2="159" stroke="#C5562A" stroke-width="1.6" opacity="0.45" stroke-linecap="round"/>
  <line x1="44" y1="164" x2="86" y2="165" stroke="#C5562A" stroke-width="1.6" opacity="0.45" stroke-linecap="round"/>

  <!-- Recipe lines on right page -->
  <line x1="110" y1="138" x2="160" y2="140" stroke="#C5562A" stroke-width="1.6" opacity="0.45" stroke-linecap="round"/>
  <line x1="110" y1="144" x2="160" y2="146" stroke="#C5562A" stroke-width="1.6" opacity="0.45" stroke-linecap="round"/>
  <line x1="110" y1="150" x2="160" y2="152" stroke="#C5562A" stroke-width="1.6" opacity="0.45" stroke-linecap="round"/>
  <line x1="110" y1="156" x2="148" y2="158" stroke="#C5562A" stroke-width="1.6" opacity="0.45" stroke-linecap="round"/>
  <line x1="110" y1="162" x2="160" y2="164" stroke="#C5562A" stroke-width="1.6" opacity="0.45" stroke-linecap="round"/>

  <!-- ===== Chef's hat above book ===== -->
  <!-- Hat puff (cloud) -->
  <path d="M 76 102
           C 56 102 56 80 76 78
           C 76 64 96 62 100 70
           C 104 62 124 64 124 78
           C 144 80 144 102 124 102 Z"
        fill="#FFFFFF" stroke="#7BA05B" stroke-width="2.5"/>
  <!-- Hat band -->
  <rect x="76" y="100" width="48" height="16" rx="2" fill="#FFFFFF" stroke="#7BA05B" stroke-width="2.5"/>
  <!-- Band subtle shadow at top -->
  <line x1="78" y1="100" x2="122" y2="100" stroke="#FFFFFF" stroke-width="3.5"/>
  <!-- Tiny heart button on the band -->
  <path d="M 100 105
           C 100 103 98 102 97 103
           C 96 102 94 103 94 105
           C 94 108 97 111 97 111
           C 97 111 100 108 100 105 Z" fill="#E8784A"/>

  <!-- Steam swirls behind hat -->
  <g stroke="#7BA05B" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M 50 56 Q 56 50 50 44 Q 44 38 50 32"/>
    <path d="M 150 56 Q 144 50 150 44 Q 156 38 150 32"/>
  </g>

  <!-- Sparkles -->
  <g fill="#F5A623">
    <circle cx="32" cy="100" r="2.5" opacity="0.7"/>
    <circle cx="168" cy="100" r="2.5" opacity="0.7"/>
    <path d="M 36 70 L 38 75 L 43 75 L 39 78 L 41 83 L 36 80 L 31 83 L 33 78 L 29 75 L 34 75 Z" opacity="0.8"/>
    <path d="M 164 70 L 166 75 L 171 75 L 167 78 L 169 83 L 164 80 L 159 83 L 161 78 L 157 75 L 162 75 Z" opacity="0.8"/>
  </g>
</svg>
