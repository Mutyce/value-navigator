<svg width="400" height="400" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <title>Ценностный навигатор для семьи</title>

  <defs>
    <path id="topArc"    d="M 148,340 A 192,192 0 0,1 532,340"/>
    <path id="bottomArc" d="M 168,368 A 172,172 0 0,0 512,368"/>
    <clipPath id="cc"><circle cx="340" cy="340" r="268"/></clipPath>
  </defs>

  <circle cx="340" cy="340" r="300" fill="#1640A8"/>

  <g stroke="rgba(255,255,255,0.06)" stroke-width="1" clip-path="url(#cc)">
    <line x1="340" y1="72"  x2="340" y2="608"/>
    <line x1="72"  y1="340" x2="608" y2="340"/>
    <line x1="150" y1="150" x2="530" y2="530"/>
    <line x1="530" y1="150" x2="150" y2="530"/>
  </g>

  <circle cx="340" cy="340" r="255" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- COMPASS: clean 4-point star -->
  <polygon points="340,165 346,196 340,203 334,196" fill="white"/>
  <polygon points="340,235 346,204 340,203 334,204" fill="rgba(255,255,255,0.36)"/>
  <polygon points="374,200 345,194 340,203 345,208" fill="rgba(255,255,255,0.36)"/>
  <polygon points="306,200 335,194 340,203 335,208" fill="rgba(255,255,255,0.36)"/>
  <circle cx="340" cy="202" r="7"   fill="white"/>
  <circle cx="340" cy="202" r="3.5" fill="#1640A8"/>

  <!-- ===== DAD (x=252): head raised, both legs straight ===== -->
  <line x1="223" y1="268" x2="190" y2="354" stroke="white" stroke-width="21" stroke-linecap="round"/>
  <line x1="281" y1="268" x2="314" y2="346" stroke="white" stroke-width="21" stroke-linecap="round"/>
  <line x1="242" y1="340" x2="228" y2="455" stroke="white" stroke-width="23" stroke-linecap="round"/>
  <line x1="264" y1="340" x2="270" y2="455" stroke="white" stroke-width="23" stroke-linecap="round"/>
  <rect x="223" y="244" width="58" height="100" rx="20" fill="white"/>
  <!-- head raised up -->
  <circle cx="252" cy="226" r="27" fill="white"/>

  <!-- ===== CHILD (x=340) ===== -->
  <line x1="320" y1="314" x2="313" y2="346" stroke="white" stroke-width="17" stroke-linecap="round"/>
  <line x1="360" y1="314" x2="367" y2="346" stroke="white" stroke-width="17" stroke-linecap="round"/>
  <line x1="330" y1="366" x2="322" y2="455" stroke="white" stroke-width="19" stroke-linecap="round"/>
  <line x1="350" y1="366" x2="358" y2="455" stroke="white" stroke-width="19" stroke-linecap="round"/>
  <rect x="317" y="296" width="46" height="74" rx="14" fill="white"/>
  <circle cx="340" cy="278" r="20" fill="white"/>

  <!-- ===== MOM (x=428): rounded skirt + legs same angle as child/dad ===== -->
  <line x1="402" y1="292" x2="367" y2="346" stroke="white" stroke-width="19" stroke-linecap="round"/>
  <line x1="454" y1="292" x2="488" y2="346" stroke="white" stroke-width="19" stroke-linecap="round"/>
  <!-- legs: same ~6° angle as dad/child, drawn before skirt -->
  <line x1="416" y1="418" x2="411" y2="455" stroke="white" stroke-width="21" stroke-linecap="round"/>
  <line x1="440" y1="418" x2="445" y2="455" stroke="white" stroke-width="21" stroke-linecap="round"/>
  <!-- skirt: smooth Q-bezier, rounded bottom (like v2 style) -->
  <path d="M400,360 Q378,394 370,424 Q428,436 486,424 Q478,394 456,360 Z" fill="white"/>
  <!-- torso on top of skirt -->
  <rect x="400" y="268" width="56" height="96" rx="18" fill="white"/>
  <!-- hair -->
  <ellipse cx="428" cy="244" rx="28" ry="12" fill="white"/>
  <!-- head -->
  <circle cx="428" cy="250" r="24" fill="white"/>

  <!-- HAND JOINS -->
  <circle cx="314" cy="346" r="12" fill="white"/>
  <circle cx="367" cy="346" r="12" fill="white"/>
  <circle cx="190" cy="354" r="11" fill="white"/>
  <circle cx="488" cy="346" r="11" fill="white"/>

  <!-- CIRCULAR TEXT -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="21" fill="white" letter-spacing="4">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">ЦЕННОСТНЫЙ НАВИГАТОР</textPath>
  </text>
  <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="21" fill="white" letter-spacing="6">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">ДЛЯ СЕМЬИ</textPath>
  </text>

  <line x1="176" y1="475" x2="208" y2="492" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <line x1="472" y1="492" x2="504" y2="475" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <circle cx="340" cy="340" r="299" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
</svg>
