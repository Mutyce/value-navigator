<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Игротека выходного дня">
  <title>Игротека выходного дня</title>

  <!-- Warm halo -->
  <circle cx="100" cy="100" r="82" fill="#F5EDE0" opacity="0.55"/>

  <!-- Soft ground shadow -->
  <ellipse cx="100" cy="178" rx="68" ry="5" fill="#3D2B1F" opacity="0.1"/>

  <!-- ===== Small die (behind, top-right, rotated) ===== -->
  <g transform="translate(140 38) rotate(15)">
    <rect x="0" y="0" width="44" height="44" rx="7" fill="#7BA05B"/>
    <!-- Top edge highlight -->
    <rect x="0" y="0" width="44" height="5" rx="2" fill="#FFFFFF" opacity="0.2"/>
    <!-- Face "3" diagonal -->
    <circle cx="11" cy="11" r="3.2" fill="#FFFFFF"/>
    <circle cx="22" cy="22" r="3.2" fill="#FFFFFF"/>
    <circle cx="33" cy="33" r="3.2" fill="#FFFFFF"/>
  </g>

  <!-- ===== Big die (foreground) ===== -->
  <g transform="translate(40 56) rotate(-6)">
    <!-- Die shadow -->
    <rect x="2" y="3" width="76" height="76" rx="11" fill="#3D2B1F" opacity="0.15"/>
    <!-- Die body -->
    <rect x="0" y="0" width="76" height="76" rx="11" fill="#FFFFFF" stroke="#E8784A" stroke-width="3"/>
    <!-- Top highlight -->
    <rect x="2" y="2" width="72" height="6" rx="3" fill="#F5EDE0"/>
    <!-- Left inner shadow -->
    <rect x="2" y="2" width="6" height="72" rx="3" fill="#F5EDE0" opacity="0.5"/>
    <!-- Face "5" pips -->
    <circle cx="18" cy="18" r="5" fill="#E8784A"/>
    <circle cx="58" cy="18" r="5" fill="#E8784A"/>
    <circle cx="38" cy="38" r="5" fill="#E8784A"/>
    <circle cx="18" cy="58" r="5" fill="#E8784A"/>
    <circle cx="58" cy="58" r="5" fill="#E8784A"/>
  </g>

  <!-- ===== Pawns at the bottom ===== -->
  <!-- Pawn 1 (orange) -->
  <g transform="translate(30 152)">
    <ellipse cx="0" cy="22" rx="13" ry="4" fill="#3D2B1F" opacity="0.15"/>
    <circle cx="0" cy="-2" r="8" fill="#E8784A"/>
    <path d="M -7 5 Q 0 8 7 5 L 11 22 L -11 22 Z" fill="#E8784A"/>
    <ellipse cx="0" cy="22" rx="11" ry="3" fill="#C5562A"/>
  </g>

  <!-- Pawn 2 (yellow) -->
  <g transform="translate(160 152)">
    <ellipse cx="0" cy="22" rx="13" ry="4" fill="#3D2B1F" opacity="0.15"/>
    <circle cx="0" cy="-2" r="8" fill="#F5A623"/>
    <path d="M -7 5 Q 0 8 7 5 L 11 22 L -11 22 Z" fill="#F5A623"/>
    <ellipse cx="0" cy="22" rx="11" ry="3" fill="#C58510"/>
  </g>

  <!-- Pawn 3 small green between dice and right pawn -->
  <g transform="translate(132 158)">
    <ellipse cx="0" cy="18" rx="10" ry="3" fill="#3D2B1F" opacity="0.12"/>
    <circle cx="0" cy="0" r="6" fill="#7BA05B"/>
    <path d="M -5 5 Q 0 7 5 5 L 8 18 L -8 18 Z" fill="#7BA05B"/>
    <ellipse cx="0" cy="18" rx="8" ry="2.5" fill="#5C7843"/>
  </g>

  <!-- Subtle sparkles -->
  <g fill="#F5A623">
    <circle cx="22" cy="50" r="2.2" opacity="0.7"/>
    <path d="M 12 100 L 14 105 L 19 105 L 15 108 L 17 113 L 12 110 L 7 113 L 9 108 L 5 105 L 10 105 Z" opacity="0.75"/>
  </g>
</svg>
