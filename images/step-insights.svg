<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Светящаяся лампочка со звёздами">
  <title>Светящаяся лампочка со звёздами</title>

  <defs>
    <radialGradient id="bulbGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFD37A"/>
      <stop offset="60%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#E08810"/>
    </radialGradient>
    <radialGradient id="auraGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer aura -->
  <circle cx="100" cy="92" r="80" fill="url(#auraGlow)"/>

  <!-- ===== Sun rays ===== -->
  <g stroke="#E8784A" stroke-width="4.5" stroke-linecap="round" fill="none">
    <line x1="100" y1="12" x2="100" y2="30"/>
    <line x1="44" y1="36" x2="56" y2="48"/>
    <line x1="156" y1="36" x2="144" y2="48"/>
    <line x1="22" y1="92" x2="40" y2="92"/>
    <line x1="178" y1="92" x2="160" y2="92"/>
    <line x1="34" y1="62" x2="50" y2="68"/>
    <line x1="166" y1="62" x2="150" y2="68"/>
  </g>

  <!-- ===== Bulb glass ===== -->
  <path d="M 100 46
           C 72 46 56 70 56 94
           C 56 110 64 122 73 132
           C 80 140 82 145 82 152
           L 118 152
           C 118 145 120 140 127 132
           C 136 122 144 110 144 94
           C 144 70 128 46 100 46 Z"
        fill="url(#bulbGlow)"/>

  <!-- Inner filament suggestion -->
  <path d="M 88 105 Q 100 122 112 105" stroke="#E8784A" stroke-width="1.5" fill="none" opacity="0.55"/>
  <line x1="88" y1="105" x2="86" y2="115" stroke="#E8784A" stroke-width="1.5" opacity="0.55"/>
  <line x1="112" y1="105" x2="114" y2="115" stroke="#E8784A" stroke-width="1.5" opacity="0.55"/>

  <!-- Highlights on bulb -->
  <ellipse cx="82" cy="76" rx="8" ry="14" fill="#FFFFFF" opacity="0.55" transform="rotate(-18 82 76)"/>
  <circle cx="76" cy="64" r="3" fill="#FFFFFF" opacity="0.8"/>

  <!-- ===== Bulb base (metal screw) ===== -->
  <!-- Top metal band -->
  <rect x="80" y="152" width="40" height="4" fill="#9C8056"/>
  <!-- Screw section with threads -->
  <path d="M 82 156 L 118 156 L 116 168 L 84 168 Z" fill="#BFA77A"/>
  <line x1="84" y1="160" x2="116" y2="160" stroke="#7A6238" stroke-width="0.9"/>
  <line x1="84" y1="164" x2="116" y2="164" stroke="#7A6238" stroke-width="0.9"/>
  <rect x="80" y="152" width="40" height="2" fill="#FFFFFF" opacity="0.3"/>
  <!-- Bottom contact tip -->
  <path d="M 87 168 L 113 168 L 108 180 L 92 180 Z" fill="#3D2B1F"/>
  <ellipse cx="100" cy="180" rx="8" ry="2" fill="#1A0F08"/>

  <!-- ===== Stars ===== -->
  <g fill="#F5A623">
    <path d="M 28 132 L 31.5 140.5 L 40.5 141.5 L 33.5 147 L 35.5 156 L 28 151 L 20.5 156 L 22.5 147 L 15.5 141.5 L 24.5 140.5 Z"/>
    <path d="M 172 132 L 175.5 140.5 L 184.5 141.5 L 177.5 147 L 179.5 156 L 172 151 L 164.5 156 L 166.5 147 L 159.5 141.5 L 168.5 140.5 Z"/>
    <path d="M 100 186 L 102 191 L 107 191.5 L 103 195 L 104.5 200 L 100 197 L 95.5 200 L 97 195 L 93 191.5 L 98 191 Z" opacity="0.85"/>
  </g>

  <!-- Tiny twinkle dots -->
  <g fill="#F5A623" opacity="0.7">
    <circle cx="55" cy="170" r="2"/>
    <circle cx="145" cy="170" r="2"/>
  </g>
</svg>
