<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Руководитель проекта">
  <title>Руководитель проекта</title>

  <!-- Halo -->
  <circle cx="100" cy="100" r="82" fill="#F5EDE0" opacity="0.55"/>

  <!-- Soft shadow -->
  <ellipse cx="100" cy="180" rx="48" ry="4" fill="#3D2B1F" opacity="0.1"/>

  <!-- Hair back layer -->
  <ellipse cx="100" cy="78" rx="38" ry="38" fill="#F5A623"/>
  <path d="M 62 80 Q 60 110 70 130 L 78 130 Q 70 105 70 80 Z" fill="#F5A623"/>
  <path d="M 138 80 Q 140 110 130 130 L 122 130 Q 130 105 130 80 Z" fill="#F5A623"/>

  <!-- Face -->
  <circle cx="100" cy="80" r="28" fill="#FFE0C8"/>

  <!-- Hair bangs -->
  <path d="M 72 70 Q 84 50 100 56 Q 116 50 128 70 L 128 76 Q 100 64 72 76 Z" fill="#F5A623"/>

  <!-- Subtle face features (very minimal, scaled for small sizes) -->
  <circle cx="90" cy="82" r="1.8" fill="#3D2B1F"/>
  <circle cx="110" cy="82" r="1.8" fill="#3D2B1F"/>
  <path d="M 94 92 Q 100 95 106 92" stroke="#3D2B1F" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="92" y="106" width="16" height="14" fill="#FFE0C8"/>

  <!-- Body (blazer) -->
  <path d="M 55 175
           L 55 145
           Q 55 120 100 118
           Q 145 120 145 145
           L 145 175 Z" fill="#7BA05B"/>

  <!-- Lapels -->
  <path d="M 80 118 L 100 145 L 120 118 L 120 130 L 100 152 L 80 130 Z" fill="#5C7843"/>

  <!-- White shirt V -->
  <path d="M 92 122 L 100 145 L 108 122 Z" fill="#FFFFFF"/>

  <!-- Tiny brooch / pin (accent) -->
  <circle cx="115" cy="135" r="2.5" fill="#F5A623"/>
</svg>
