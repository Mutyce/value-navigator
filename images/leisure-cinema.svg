<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Дворовый кинозал">
  <title>Дворовый кинозал</title>

  <defs>
    <linearGradient id="screenSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE9C4"/>
      <stop offset="100%" stop-color="#F5DDC4"/>
    </linearGradient>
  </defs>

  <!-- Warm halo -->
  <circle cx="100" cy="100" r="82" fill="#F5EDE0" opacity="0.5"/>

  <!-- ===== Background stars (night sky vibe) ===== -->
  <g fill="#F5A623">
    <path d="M 32 50 L 34 56 L 40 56 L 35 60 L 37 66 L 32 62 L 27 66 L 29 60 L 24 56 L 30 56 Z" opacity="0.85"/>
    <path d="M 168 50 L 170 56 L 176 56 L 171 60 L 173 66 L 168 62 L 163 66 L 165 60 L 160 56 L 166 56 Z" opacity="0.85"/>
    <circle cx="50" cy="32" r="2" opacity="0.7"/>
    <circle cx="150" cy="32" r="2" opacity="0.7"/>
    <circle cx="100" cy="22" r="2.5" opacity="0.8"/>
  </g>

  <!-- ===== Screen ===== -->
  <!-- Frame (outer) -->
  <rect x="34" y="50" width="132" height="84" rx="4" fill="#3D2B1F"/>
  <!-- Frame inner edge -->
  <rect x="34" y="50" width="132" height="6" fill="#5A4030"/>
  <!-- Screen surface -->
  <rect x="40" y="58" width="120" height="72" rx="2" fill="url(#screenSky)"/>

  <!-- Screen content: heart on the screen -->
  <path d="M 100 92
           C 100 86 92 82 88 88
           C 84 82 76 86 76 92
           C 76 102 88 114 88 114
           Z
           M 100 92
           C 100 86 108 82 112 88
           C 116 82 124 86 124 92
           C 124 102 112 114 112 114
           Z" fill="#E8784A"/>
  <path d="M 88 114 L 100 122 L 112 114 Z" fill="#E8784A"/>

  <!-- Screen reflection highlight -->
  <rect x="40" y="58" width="120" height="8" rx="1" fill="#FFFFFF" opacity="0.35"/>
  <!-- Soft side light -->
  <rect x="40" y="58" width="6" height="72" fill="#FFFFFF" opacity="0.15"/>

  <!-- ===== Stand ===== -->
  <!-- Two legs -->
  <path d="M 56 134 L 44 168" stroke="#3D2B1F" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 144 134 L 156 168" stroke="#3D2B1F" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Base bar -->
  <rect x="38" y="166" width="124" height="5" rx="2.5" fill="#3D2B1F"/>

  <!-- ===== Popcorn box ===== -->
  <!-- Box body (trapezoid) -->
  <path d="M 86 172 L 114 172 L 117 192 L 83 192 Z" fill="#E8784A"/>
  <!-- White stripes -->
  <path d="M 93 173 L 95.5 191 L 99 191 L 96.5 173 Z" fill="#FFFFFF"/>
  <path d="M 104 173 L 106.5 191 L 110 191 L 107.5 173 Z" fill="#FFFFFF"/>
  <!-- Box top edge -->
  <rect x="83" y="170" width="34" height="4" rx="1" fill="#C5562A"/>
  <!-- Popcorn kernels on top -->
  <circle cx="89" cy="168" r="4" fill="#FFFFFF"/>
  <circle cx="97" cy="164" r="5" fill="#FFFFFF"/>
  <circle cx="106" cy="166" r="4.5" fill="#FFFFFF"/>
  <circle cx="113" cy="170" r="3.5" fill="#FFFFFF"/>
  <circle cx="100" cy="160" r="3.5" fill="#FFD37A"/>
</svg>
