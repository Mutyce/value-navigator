<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Методист">
  <title>Методист</title>

  <!-- Halo -->
  <circle cx="100" cy="105" r="82" fill="#F5EDE0" opacity="0.55"/>

  <!-- Soft shadow -->
  <ellipse cx="100" cy="180" rx="62" ry="5" fill="#3D2B1F" opacity="0.12"/>

  <!-- Bottom book (largest, primary orange) -->
  <rect x="32" y="148" width="136" height="30" rx="3" fill="#E8784A"/>
  <rect x="32" y="148" width="6" height="30" fill="#A04020"/>
  <rect x="32" y="148" width="136" height="4" fill="#FFFFFF" opacity="0.2"/>
  <line x1="50" y1="158" x2="160" y2="158" stroke="#FFFFFF" stroke-width="1" opacity="0.45"/>
  <line x1="50" y1="172" x2="160" y2="172" stroke="#FFFFFF" stroke-width="1" opacity="0.45"/>

  <!-- Middle book (secondary green, slightly offset right) -->
  <rect x="44" y="116" width="124" height="30" rx="3" fill="#7BA05B"/>
  <rect x="44" y="116" width="6" height="30" fill="#5C7843"/>
  <rect x="44" y="116" width="124" height="4" fill="#FFFFFF" opacity="0.2"/>
  <line x1="62" y1="126" x2="160" y2="126" stroke="#FFFFFF" stroke-width="1" opacity="0.45"/>
  <line x1="62" y1="140" x2="160" y2="140" stroke="#FFFFFF" stroke-width="1" opacity="0.45"/>

  <!-- Top book (accent yellow, offset left) -->
  <rect x="36" y="84" width="124" height="30" rx="3" fill="#F5A623"/>
  <rect x="36" y="84" width="6" height="30" fill="#C58510"/>
  <rect x="36" y="84" width="124" height="4" fill="#FFFFFF" opacity="0.25"/>
  <line x1="54" y1="94" x2="152" y2="94" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  <line x1="54" y1="108" x2="152" y2="108" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>

  <!-- Bookmark ribbon on top book -->
  <path d="M 124 84 L 124 72 L 138 72 L 138 84 L 131 79 Z" fill="#E8784A"/>

  <!-- Small heart hovering above stack -->
  <path d="M 100 52
           C 100 47 92 43 89 48
           C 86 43 78 47 78 52
           C 78 60 89 70 89 70
           Z
           M 100 52
           C 100 47 108 43 111 48
           C 114 43 122 47 122 52
           C 122 60 111 70 111 70
           Z" fill="#F5A623"/>
  <path d="M 89 70 L 100 78 L 111 70 Z" fill="#F5A623"/>

  <!-- Sparkles -->
  <g fill="#F5A623">
    <circle cx="22" cy="100" r="2.5" opacity="0.7"/>
    <circle cx="178" cy="100" r="2.5" opacity="0.7"/>
    <path d="M 30 50 L 32 55 L 37 55 L 33 58 L 35 63 L 30 60 L 25 63 L 27 58 L 23 55 L 28 55 Z" opacity="0.75"/>
    <path d="M 170 50 L 172 55 L 177 55 L 173 58 L 175 63 L 170 60 L 165 63 L 167 58 L 163 55 L 168 55 Z" opacity="0.75"/>
  </g>
</svg>
