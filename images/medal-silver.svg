<svg xmlns="http://www.w3.org/2000/svg" width="100" height="120" viewBox="0 0 100 120" role="img" aria-label="Второе место">
  <title>Второе место</title>

  <defs>
    <radialGradient id="silverRing" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F0F2F5"/>
      <stop offset="60%" stop-color="#B8BAC2"/>
      <stop offset="100%" stop-color="#7A7C85"/>
    </radialGradient>
  </defs>

  <!-- Ribbons -->
  <polygon points="20,2 38,2 44,38 30,32 20,38" fill="#5B7BA0"/>
  <polygon points="80,2 62,2 56,38 70,32 80,38" fill="#7BA0C8"/>
  <polygon points="20,2 30,32 20,38" fill="#3D5B82"/>
  <polygon points="80,2 70,32 80,38" fill="#3D5B82"/>

  <!-- Medal outer ring -->
  <circle cx="50" cy="75" r="36" fill="url(#silverRing)"/>
  <!-- Inner disk -->
  <circle cx="50" cy="75" r="28" fill="#D5D6DC"/>
  <!-- Inner edge ring -->
  <circle cx="50" cy="75" r="28" fill="none" stroke="#7A7C85" stroke-width="1.5"/>

  <!-- Number 2 -->
  <text x="50" y="86" font-family="Arial, sans-serif" font-size="34" font-weight="900"
        fill="#5A5C65" text-anchor="middle">2</text>

  <!-- Shine highlight -->
  <ellipse cx="38" cy="60" rx="7" ry="11" fill="#FFFFFF" opacity="0.55" transform="rotate(-25 38 60)"/>
</svg>
