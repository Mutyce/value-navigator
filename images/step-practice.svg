<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Две руки бережно держат сердце">
  <title>Вместе бережно держим общее</title>

  <defs>
    <radialGradient id="warmth" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#F5EDE0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F5EDE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB94A"/>
      <stop offset="100%" stop-color="#E68A0E"/>
    </linearGradient>
  </defs>

  <!-- Warm halo -->
  <circle cx="100" cy="105" r="85" fill="url(#warmth)"/>

  <!-- ===== Embracing arms (form a soft cradle/heart-base) ===== -->
  <!-- Left arm -->
  <path d="M 22 178
           C 18 152 24 122 50 108
           C 70 98 84 105 92 118"
        stroke="#7BA05B" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- Right arm -->
  <path d="M 178 178
           C 182 152 176 122 150 108
           C 130 98 116 105 108 118"
        stroke="#7BA05B" stroke-width="22" stroke-linecap="round" fill="none"/>

  <!-- Inner highlight on arms (gives roundness) -->
  <path d="M 30 170 C 28 150 36 130 56 120"
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.25"/>
  <path d="M 170 170 C 172 150 164 130 144 120"
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.25"/>

  <!-- ===== Hands meeting in the centre (thumbs up, fingers curving inward) ===== -->
  <!-- Left hand palm -->
  <path d="M 78 108
           C 76 100 80 92 88 90
           C 96 88 102 94 102 102
           L 102 122
           C 100 130 92 134 84 130
           C 76 126 76 116 78 108 Z"
        fill="#7BA05B"/>
  <!-- Left thumb -->
  <ellipse cx="98" cy="98" rx="5" ry="9" fill="#7BA05B" transform="rotate(15 98 98)"/>

  <!-- Right hand palm -->
  <path d="M 122 108
           C 124 100 120 92 112 90
           C 104 88 98 94 98 102
           L 98 122
           C 100 130 108 134 116 130
           C 124 126 124 116 122 108 Z"
        fill="#7BA05B"/>
  <!-- Right thumb -->
  <ellipse cx="102" cy="98" rx="5" ry="9" fill="#7BA05B" transform="rotate(-15 102 98)"/>

  <!-- Subtle line where hands meet -->
  <path d="M 100 92 L 100 130" stroke="#5C7843" stroke-width="0.8" opacity="0.4"/>

  <!-- ===== Heart cradled above the hands ===== -->
  <path d="M 100 92
           C 100 80 86 70 76 78
           C 66 85 68 100 76 110
           C 84 120 100 130 100 130
           C 100 130 116 120 124 110
           C 132 100 134 85 124 78
           C 114 70 100 80 100 92 Z"
        fill="url(#heartShade)"/>
  <!-- Heart highlight -->
  <ellipse cx="84" cy="88" rx="5" ry="8" fill="#FFFFFF" opacity="0.45" transform="rotate(-25 84 88)"/>
  <circle cx="80" cy="82" r="2" fill="#FFFFFF" opacity="0.7"/>

  <!-- ===== Sparkles around ===== -->
  <g fill="#E8784A">
    <!-- Top-left star -->
    <path d="M 38 52 L 41 60 L 49 61 L 43 66 L 45 74 L 38 70 L 31 74 L 33 66 L 27 61 L 35 60 Z"/>
    <!-- Top-right star -->
    <path d="M 162 52 L 165 60 L 173 61 L 167 66 L 169 74 L 162 70 L 155 74 L 157 66 L 151 61 L 159 60 Z"/>
  </g>
  <g fill="#F5A623">
    <!-- Small twinkles -->
    <circle cx="22" cy="100" r="2.5" opacity="0.75"/>
    <circle cx="178" cy="100" r="2.5" opacity="0.75"/>
    <circle cx="60" cy="40" r="2" opacity="0.6"/>
    <circle cx="140" cy="40" r="2" opacity="0.6"/>
    <circle cx="100" cy="32" r="2.5" opacity="0.8"/>
  </g>
</svg>
